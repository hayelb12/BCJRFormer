# Concatenated scheme: LDPC(96,48) outer code + convolutional inner code.
# Pair with a model config, e.g.:
#   poetry run python main.py -c configs/model/convbcjrformer_config.yaml configs/code/code_config_ldpc_96_48_conv.yaml
inner_code_config: ConvolutionalCodeConfig

LinearCodeConfig:
  code_type: LDPC
  n: 96
  k: 48
  q: 2
  file_extension: .txt

ConvolutionalCodeConfig:
  k: 1
  g: [5, 7]
  p: 1
  random_offset: False
