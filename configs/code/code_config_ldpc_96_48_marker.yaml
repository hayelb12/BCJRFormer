# Concatenated scheme: LDPC(96,48) outer code + marker inner code.
# Pair with a model config, e.g.:
#   poetry run python main.py -c configs/model/bcjrformer_config.yaml configs/code/code_config_ldpc_96_48_marker.yaml

inner_code_config: MarkerCodeConfig

LinearCodeConfig:
  code_type: LDPC
  n: 96
  k: 48
  q: 2
  file_extension: .txt

MarkerCodeConfig:
  marker: [0, 0, 1]
  N_c: 6
  p: 1
