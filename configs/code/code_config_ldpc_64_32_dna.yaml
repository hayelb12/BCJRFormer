# Concatenated scheme: LDPC(64,32) over GF(4) outer code + marker inner code.
# Pair with a model config, e.g.:
#   poetry run python main.py -c configs/model/bcjrformer_config.yaml configs/code/code_config_ldpc_64_32_dna.yaml
#
# Spock note: code parameters live in per-class namespace blocks (not bare
# top-level keys) because `k`/`p` are shared across the code configs and would
# otherwise be ambiguous to Spock.

inner_code_config: MarkerCodeConfig

LinearCodeConfig:
  code_type: LDPC
  n: 64
  k: 32
  q: 4
  custom_file_name: LDPC_N64_K32_QC_NB_FIXED_WEIGHTS.alist
  file_extension: .alist

MarkerCodeConfig:
  marker: [3, 2]
  N_c: 6
  p: 2 # corresponds to q = 4
