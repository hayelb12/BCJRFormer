# Path to a trained checkpoint (written by main.py under Results_BCJRFORMER/<run>/).
# Set this to your run, or override per invocation with
#   --EvaluationConfig.model_path <path/to/best_model.pth>
# The architecture below (d_model, N_dec, h) must match the trained checkpoint.
model_path: Results_BCJRFORMER/<run>/best_model.pth

specific_model: "BCJRFormerModel"

workers: 0

masked_attention: true
gpu: 0

compile_model: false

test_batch_size: 256
test_batches_per_epoch: 1600


seed: 42
N_dec: 1
d_model: 16
h: 2

log_wandb: false

IDSChannelConfig:
  p_d: 0.05
  p_s: 0.05
  p_i: 0.05


InnerModelConfig:
  delta_std_multiplier: 3.5
  n_sequence_min: 1
  n_sequence_max: 1