# Path to a trained checkpoint (written by main.py under Results_BCJRFORMER/<run>/).
# Override per run with --EvaluationConfig.model_path <path/to/best_model.pth>.
# Architecture below (d_model/N_dec/h) and InnerModelConfig must match the checkpoint.
model_path: Results_BCJRFORMER/<run>/best_model.pth

specific_model: "ConvBCJRFormerModel"

workers: 0

masked_attention: true
gpu: 0

compile_model: false

test_batch_size: 256
test_batches_per_epoch: 1600


seed: 42
N_dec: 6
d_model: 96
h: 8

log_wandb: false

IDSChannelConfig:
  p_d: 0.05
  p_s: 0.05
  p_i: 0.05


InnerModelConfig:
  delta_std_multiplier: 3.5
  n_sequence_min: 1
  n_sequence_max: 1

ConvBCJRFormerModel:
  N_dec_symbol: 1
  N_dec_state: 1
  N_dec_cross: 1
  h_symbol: 1
  h_state: 1
  h_symbol_to_state: 2
  h_state_to_symbol: 2
